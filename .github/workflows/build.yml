name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Tag build'
        required: true
        type: string
      build_type:
        description: 'Tipe build (debug/release)'
        required: true
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Download project zip
        run: |
          echo "⬇️ Downloading project from: ${{ inputs.zip_url }}"
          wget -O project.zip "${{ inputs.zip_url }}"
          unzip -q project.zip -d project/
          ls -la project/

      - name: Flutter pub get
        working-directory: ./project
        run: flutter pub get

      - name: Build APK (${{ inputs.build_type }})
        working-directory: ./project
        run: |
          if [ "${{ inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
